version: 1
description: Synthetic static example; not a certified device rule pack
rules:
- id: DDR
  kind: ddr
  scope:
  - fpga/endpoint/chip
  params:
    controller:
    - dq:
      - fpga/endpoint/chip.D0
      - fpga/endpoint/chip.D1
      - fpga/endpoint/chip.D2
      - fpga/endpoint/chip.D3
      dqs_p: fpga/endpoint/chip.DQS_P
      dqs_n: fpga/endpoint/chip.DQS_N
      dm: fpga/endpoint/chip.DM
    memory:
    - dq:
      - soc/endpoint/chip.D0
      - soc/endpoint/chip.D1
      - soc/endpoint/chip.D2
      - soc/endpoint/chip.D3
      dqs_p: soc/endpoint/chip.DQS_P
      dqs_n: soc/endpoint/chip.DQS_N
      dm: soc/endpoint/chip.DM
- id: CLOCK
  kind: connected
  scope:
  - fpga/endpoint/chip.CLK
  params:
    targets:
    - soc/endpoint/chip.CLK
- id: RESET
  kind: connected
  scope:
  - fpga/endpoint/chip.RST
  params:
    targets:
    - soc/endpoint/chip.RST
